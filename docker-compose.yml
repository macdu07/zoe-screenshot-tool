services:
  zoe-screenshot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      CAPTURE_CONCURRENCY: ${CAPTURE_CONCURRENCY:-2}
      CAPTURE_QUEUE_LIMIT: ${CAPTURE_QUEUE_LIMIT:-20}
      CAPTURE_RATE_LIMIT: ${CAPTURE_RATE_LIMIT:-30}
      MAX_OUTPUT_PIXELS: ${MAX_OUTPUT_PIXELS:-100000000}
      MAX_PAGE_HEIGHT: ${MAX_PAGE_HEIGHT:-30000}
      MAX_SCREENSHOT_BYTES: ${MAX_SCREENSHOT_BYTES:-52428800}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      CLIENT_ID_SECRET: ${CLIENT_ID_SECRET:-}
      ALLOW_PRIVATE_NETWORK: "false"
      EXPOSE_TEST_STATIC: "false"
    volumes:
      - zoe_storage:/app/storage
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  zoe_storage:
